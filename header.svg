<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <!-- Soft Clean Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Clean Drop Shadow -->
    <filter id="cleanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <filter id="avatarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3b82f6" flood-opacity="0.25"/>
    </filter>

    <!-- Circular Clip for Avatar -->
    <clipPath id="avatarClip">
      <circle cx="115" cy="140" r="56"/>
    </clipPath>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap');

      text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Avatar Animation */
      .avatar-group {
        animation: avatarEnter 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                   avatarFloat 4s ease-in-out infinite 1s;
        transform-origin: 115px 140px;
      }
      .avatar-ring {
        animation: ringRotate 8s linear infinite;
        transform-origin: 115px 140px;
      }

      /* Badge Animation */
      .badge-group {
        opacity: 0;
        animation: fadeInDown 0.8s ease forwards 0.4s;
      }

      /* Name Animation */
      .name-text {
        opacity: 0;
        animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.7s;
      }

      /* Subtitle Animation */
      .sub-text {
        opacity: 0;
        animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 1s;
      }

      /* Accent line */
      .accent-line {
        stroke-dasharray: 480;
        stroke-dashoffset: 480;
        animation: drawLine 1.2s ease forwards 1.2s;
      }

      /* Subtle floating ambient circles */
      .orb-1 {
        animation: orbMove1 7s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: orbMove2 6s ease-in-out infinite alternate;
      }

      @keyframes avatarEnter {
        0% { transform: scale(0.3); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes avatarFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes ringRotate {
        100% { transform: rotate(360deg); }
      }
      @keyframes fadeInDown {
        0% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes orbMove1 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(20px, 15px); }
      }
      @keyframes orbMove2 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-25px, -10px); }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="5" y="5" width="840" height="270" rx="20" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cleanShadow)"/>

  <!-- Soft Clean Decorative Orbs -->
  <g opacity="0.6">
    <circle class="orb-1" cx="720" cy="60" r="100" fill="#e0f2fe" filter="blur(35px)"/>
    <circle class="orb-2" cx="240" cy="220" r="80" fill="#dbeafe" filter="blur(30px)"/>
    <circle cx="800" cy="230" r="60" fill="#ede9fe" filter="blur(30px)"/>
  </g>

  <!-- Subtle Clean Dot Pattern -->
  <g fill="#cbd5e1" opacity="0.35">
    <circle cx="750" cy="180" r="2.5"/>
    <circle cx="770" cy="180" r="2.5"/>
    <circle cx="790" cy="180" r="2.5"/>
    <circle cx="750" cy="200" r="2.5"/>
    <circle cx="770" cy="200" r="2.5"/>
    <circle cx="790" cy="200" r="2.5"/>
    <circle cx="750" cy="220" r="2.5"/>
    <circle cx="770" cy="220" r="2.5"/>
    <circle cx="790" cy="220" r="2.5"/>
  </g>

  <!-- Avatar Group -->
  <g class="avatar-group">
    <!-- Outer dashed animated ring -->
    <circle class="avatar-ring" cx="115" cy="140" r="65" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="8 6"/>
    
    <!-- White background base for avatar -->
    <circle cx="115" cy="140" r="59" fill="#ffffff" filter="url(#avatarShadow)"/>
    
    <!-- Clean ring border -->
    <circle cx="115" cy="140" r="57.5" fill="none" stroke="#ffffff" stroke-width="3"/>

    <!-- Avatar Image (GitHub Profile) -->
    <image href="data:image/png;base64," 
           x="59" y="84" width="112" height="112" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

    <!-- Status Online Badge -->
    <circle cx="160" cy="178" r="8" fill="#ffffff"/>
    <circle cx="160" cy="178" r="6" fill="#10b981"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(210, 0)">
    <!-- Pill Badge: Welcome To My GitHub -->
    <g class="badge-group" transform="translate(0, 58)">
      <rect x="0" y="0" width="235" height="30" rx="15" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#3b82f6"/>
      <text x="30" y="19" font-size="12" font-weight="700" fill="#2563eb" letter-spacing="1.2">WELCOME TO MY GITHUB</text>
    </g>

    <!-- Main Title: Name -->
    <text class="name-text" x="0" y="132" font-size="32" font-weight="800" fill="url(#nameGrad)" letter-spacing="0.5">
      FIKO NAUFAL NUR ROHMAN
    </text>

    <!-- Clean Accent Underline -->
    <line class="accent-line" x1="0" y1="148" x2="440" y2="148" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Subtitle: Role & Highlights -->
    <g class="sub-text" transform="translate(0, 182)">
      <text x="0" y="0" font-size="16" font-weight="600" fill="#475569">
        Web Developer
      </text>
      <circle cx="132" cy="-5" r="3" fill="#94a3b8"/>
      <text x="146" y="0" font-size="16" font-weight="600" fill="#2563eb">
        Cybersecurity Enthusiast
      </text>
      <circle cx="355" cy="-5" r="3" fill="#94a3b8"/>
      <text x="368" y="0" font-size="16" font-weight="600" fill="#475569">
        CTF Player
      </text>
    </g>

    <!-- Small subtle footer badge inside card -->
    <g class="sub-text" transform="translate(0, 218)" opacity="0.85">
      <rect x="0" y="0" width="135" height="24" rx="6" fill="#f1f5f9"/>
      <text x="10" y="16" font-size="11.5" font-weight="600" fill="#64748b">📍 Jakarta, Indonesia</text>

      <rect x="145" y="0" width="130" height="24" rx="6" fill="#f1f5f9"/>
      <text x="155" y="16" font-size="11.5" font-weight="600" fill="#64748b">🎓 SMKN 40 Jakarta</text>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>

    <!-- Ring & Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Card Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="avatarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2563eb" flood-opacity="0.22"/>
    </filter>

    <!-- Circular Avatar Clip -->
    <clipPath id="avatarClip">
      <circle cx="120" cy="140" r="62"/>
    </clipPath>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');

      * {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Non-breaking animations that never hide content */
      .ring-spin {
        animation: spin 12s linear infinite;
        transform-origin: 120px 140px;
      }
      .avatar-float {
        animation: float 4s ease-in-out infinite;
      }
      .status-pulse {
        animation: pulse 1.8s ease-in-out infinite;
      }

      @keyframes spin {
        100% { transform: rotate(360deg); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Main Clean Card -->
  <rect x="6" y="6" width="868" height="298" rx="20" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Soft Ambient Glow Orbs -->
  <g opacity="0.5">
    <circle cx="810" cy="50" r="90" fill="#e0f2fe" filter="blur(35px)"/>
    <circle cx="280" cy="270" r="80" fill="#dbeafe" filter="blur(30px)"/>
  </g>

  <!-- Subtle Clean Dot Matrix -->
  <g fill="#94a3b8" opacity="0.22">
    <circle cx="815" cy="140" r="2.5"/><circle cx="832" cy="140" r="2.5"/><circle cx="849" cy="140" r="2.5"/>
    <circle cx="815" cy="155" r="2.5"/><circle cx="832" cy="155" r="2.5"/><circle cx="849" cy="155" r="2.5"/>
    <circle cx="815" cy="170" r="2.5"/><circle cx="832" cy="170" r="2.5"/><circle cx="849" cy="170" r="2.5"/>
  </g>

  <!-- ==================== LEFT: AVATAR SECTION ==================== -->
  <g class="avatar-float">
    <!-- Spinning Dashed Ring -->
    <circle class="ring-spin" cx="120" cy="140" r="72" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="10 7"/>
    
    <!-- White Avatar Backing -->
    <circle cx="120" cy="140" r="65" fill="#ffffff" filter="url(#avatarShadow)"/>
    <circle cx="120" cy="140" r="63.5" fill="none" stroke="#eff6ff" stroke-width="3"/>

    <!-- Avatar Image (GitHub Profile) -->
    <image href="data:image/png;base64," 
           x="58" y="78" width="124" height="124" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

    <!-- Online Status Dot -->
    <circle cx="166" cy="182" r="8" fill="#ffffff"/>
    <circle class="status-pulse" cx="166" cy="182" r="6" fill="#10b981"/>

    <!-- Cool Level / Status Tag Below Avatar -->
    <rect x="60" y="222" width="120" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="120" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1">⚡ SWEET 17</text>
  </g>

  <!-- ==================== RIGHT: IDENTITY BESIDE PHOTO ==================== -->
  
  <!-- Welcome Tag -->
  <rect x="228" y="32" width="230" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="242" y="49" font-size="13">👋</text>
  <text x="262" y="49" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="0.8">WELCOME TO MY GITHUB</text>

  <!-- Full Name -->
  <text x="228" y="90" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="0.5">
    FIKO NAUFAL NUR ROHMAN
  </text>

  <!-- Accent Divider Line -->
  <line x1="228" y1="104" x2="650" y2="104" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Row 1: Call Me & Age -->
  <!-- Box 1: Call Me -->
  <rect x="228" y="120" width="295" height="38" rx="10" fill="url(#pillGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#pillShadow)"/>
  <text x="242" y="144" font-size="16">🤙</text>
  <text x="268" y="144" font-size="12" font-weight="600" fill="#64748b">Call Me :</text>
  <text x="328" y="144" font-size="12.5" font-weight="800" fill="#1e293b">Fiko • Fik • Ko</text>

  <!-- Box 2: Age -->
  <rect x="535" y="120" width="310" height="38" rx="10" fill="url(#pillGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#pillShadow)"/>
  <text x="548" y="144" font-size="16">🔥</text>
  <text x="574" y="144" font-size="12" font-weight="600" fill="#64748b">Age :</text>
  <text x="612" y="144" font-size="12.5" font-weight="800" fill="#1e293b">17 Years Old (Sweet 17)</text>

  <!-- Row 2: Born (TTL) & Location -->
  <!-- Box 3: Born (TTL) -->
  <rect x="228" y="168" width="295" height="38" rx="10" fill="url(#pillGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#pillShadow)"/>
  <text x="242" y="192" font-size="16">🎂</text>
  <text x="268" y="192" font-size="12" font-weight="600" fill="#64748b">Born :</text>
  <text x="314" y="192" font-size="12.5" font-weight="800" fill="#1e293b">July 30, 2009</text>

  <!-- Box 4: Location -->
  <rect x="535" y="168" width="310" height="38" rx="10" fill="url(#pillGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#pillShadow)"/>
  <text x="548" y="192" font-size="16">📍</text>
  <text x="574" y="192" font-size="12" font-weight="600" fill="#64748b">Living in :</text>
  <text x="636" y="192" font-size="12.5" font-weight="800" fill="#1e293b">DKI Jakarta, Jakarta Timur 🇮🇩</text>

  <!-- Row 3: Status / School -->
  <!-- Box 5: Status -->
  <rect x="228" y="216" width="617" height="38" rx="10" fill="url(#pillGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#pillShadow)"/>
  <text x="242" y="240" font-size="16">🎒</text>
  <text x="268" y="240" font-size="12" font-weight="600" fill="#64748b">Status :</text>
  <text x="322" y="240" font-size="12.5" font-weight="800" fill="#2563eb">Student @ SMK Negeri 40 Jakarta</text>

</svg>
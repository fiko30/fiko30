<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>

    <!-- Ring & Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Card Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <filter id="avatarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2563eb" flood-opacity="0.22"/>
    </filter>

    <!-- Circular Avatar Clip -->
    <clipPath id="avatarClip">
      <circle cx="120" cy="140" r="62"/>
    </clipPath>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');

      * {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Non-breaking animations that never hide content */
      .ring-spin {
        animation: spin 12s linear infinite;
        transform-origin: 120px 140px;
      }
      .avatar-float {
        animation: float 4s ease-in-out infinite;
      }
      .status-pulse {
        animation: pulse 1.8s ease-in-out infinite;
      }

      @keyframes spin {
        100% { transform: rotate(360deg); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Main Clean Card -->
  <rect x="6" y="6" width="868" height="298" rx="20" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Soft Ambient Glow Orbs -->
  <g opacity="0.5">
    <circle cx="810" cy="50" r="90" fill="#e0f2fe" filter="blur(35px)"/>
    <circle cx="280" cy="270" r="80" fill="#dbeafe" filter="blur(30px)"/>
  </g>

  <!-- Subtle Clean Dot Matrix -->
  <g fill="#94a3b8" opacity="0.22">
    <circle cx="815" cy="140" r="2.5"/><circle cx="832" cy="140" r="2.5"/><circle cx="849" cy="140" r="2.5"/>
    <circle cx="815" cy="155" r="2.5"/><circle cx="832" cy="155" r="2.5"/><circle cx="849" cy="155" r="2.5"/>
    <circle cx="815" cy="170" r="2.5"/><circle cx="832" cy="170" r="2.5"/><circle cx="849" cy="170" r="2.5"/>
  </g>

  <!-- ==================== LEFT: AVATAR SECTION ==================== -->
  <g class="avatar-float">
    <!-- Spinning Dashed Ring -->
    <circle class="ring-spin" cx="120" cy="140" r="72" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="10 7"/>
    
    <!-- White Avatar Backing -->
    <circle cx="120" cy="140" r="65" fill="#ffffff" filter="url(#avatarShadow)"/>
    <circle cx="120" cy="140" r="63.5" fill="none" stroke="#eff6ff" stroke-width="3"/>

    <!-- Avatar Image (GitHub Profile) -->
    <image href="data:image/png;base64," 
           x="58" y="78" width="124" height="124" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

    <!-- Online Status Dot -->
    <circle cx="166" cy="182" r="8" fill="#ffffff"/>
    <circle class="status-pulse" cx="166" cy="182" r="6" fill="#10b981"/>

    <!-- Cool Level / Status Tag Below Avatar -->
    <rect x="60" y="222" width="120" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="120" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1">⚡ SWEET 17</text>
  </g>

  <!-- ==================== CONTENT ROWS ==================== -->

  <!-- Row 1: Full Name (Full Width) -->
  <rect x="228" y="74" width="617" height="42" rx="10" fill="url(#pillGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#pillShadow)"/>
  <text x="242" y="100" font-size="16">👤</text>
  <text x="268" y="100" font-size="12" font-weight="600" fill="#64748b">Full Name :</text>
  <text x="350" y="100" font-size="13" font-weight="800" fill="#1e293b">Fiko Naufal Nur Rohman</text>

  <!-- Row 2: Age & Location (Two Columns) -->
  <!-- Box: Age -->
  <rect x="228" y="134" width="295" height="42" rx="10" fill="url(#pillGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#pillShadow)"/>
  <text x="242" y="160" font-size="16">🔥</text>
  <text x="268" y="160" font-size="12" font-weight="600" fill="#64748b">Age :</text>
  <text x="312" y="160" font-size="12.5" font-weight="800" fill="#1e293b">17 Years Old</text>

  <!-- Box: Location -->
  <rect x="535" y="134" width="310" height="42" rx="10" fill="url(#pillGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#pillShadow)"/>
  <text x="548" y="160" font-size="16">📍</text>
  <text x="574" y="160" font-size="12" font-weight="600" fill="#64748b">Living in :</text>
  <text x="636" y="160" font-size="12.5" font-weight="800" fill="#1e293b">DKI Jakarta, Jakarta Timur</text>

  <!-- Row 3: Status (Full Width) -->
  <rect x="228" y="194" width="617" height="42" rx="10" fill="url(#pillGrad)" stroke="#e2e8f0" stroke-width="1.2" filter="url(#pillShadow)"/>
  <text x="242" y="220" font-size="16">🎒</text>
  <text x="268" y="220" font-size="12" font-weight="600" fill="#64748b">Status :</text>
  <text x="322" y="220" font-size="12.5" font-weight="800" fill="#2563eb">Student at SMK Negeri 40 Jakarta</text>

</svg>